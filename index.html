<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Online</title>
    <meta name="description" content="A premium, free-for-all online Blackjack experience.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Alfa+Slab+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="disco-bg"></div>

    <!-- ============ MAIN MENU ============ -->
    <div id="main-menu" class="main-menu-overlay">
        <div class="menu-suits menu-suits-left">
            <span class="suit-icon spade">&spades;</span>
            <span class="suit-icon club">&clubs;</span>
        </div>
        <div class="menu-box">
            <div class="menu-title">
                <span class="menu-title-top">21</span>
                <span class="menu-title-main">BLACKJACK</span>
                <span class="menu-title-sub">ONLINE</span>
            </div>
            <div class="menu-buttons">
                <button id="btn-menu-continue" class="menu-btn continue-btn" disabled>
                    <span class="menu-btn-label">CONTINUE</span>
                    <span class="menu-btn-sub">Resume last game</span>
                </button>
                <button id="btn-menu-delete" class="menu-btn delete-btn" disabled>
                    <span class="menu-btn-label">DELETE GAME</span>
                    <span class="menu-btn-sub">Erase saved progress</span>
                </button>
                <button id="btn-menu-new" class="menu-btn new-btn">
                    <span class="menu-btn-label">NEW GAME</span>
                    <span class="menu-btn-sub">Start fresh</span>
                </button>
                <button id="btn-menu-shop" class="menu-btn shop-btn" disabled>
                    <span class="menu-btn-label">SHOP</span>
                    <span class="menu-btn-sub neon-text">COMING SOON</span>
                </button>
            </div>
        </div>
        <div class="menu-suits menu-suits-right">
            <span class="suit-icon diamond">&diams;</span>
            <span class="suit-icon heart">&hearts;</span>
        </div>
    </div>

    <!-- ============ GAME SCREEN ============ -->
    <div id="game-screen" class="hidden">

        <!-- Game Over / 0 Balance Overlay -->
        <div id="game-over-overlay" class="overlay hidden">
            <button id="btn-new-game" class="btn primary huge">MAIN MENU</button>
        </div>

        <!-- Bet Area (Top Left) -->
        <div class="bet-area">
            <div class="bet-label">Current Bet: $<span id="current-bet">0</span></div>
            <div id="chip-container-bet" class="chip-container"></div>
        </div>

        <!-- Bank Area (Bottom Left) -->
        <div class="bank-area">
            <div class="bet-label">Bank: $<span id="current-balance">250</span></div>
            <div id="chip-container-bank" class="chip-container">
                <div class="chip chip-1" data-value="1"><span>1</span></div>
                <div class="chip chip-10" data-value="10"><span>10</span></div>
                <div class="chip chip-100" data-value="100"><span>100</span></div>
                <div class="chip chip-500" data-value="500"><span>500</span></div>
                <div class="chip chip-1k" data-value="1000"><span>1k</span></div>
                <div class="chip chip-5k" data-value="5000"><span>5k</span></div>
                <div class="chip chip-10k" data-value="10000"><span>10k</span></div>
                <div class="chip chip-25k" data-value="25000"><span>25k</span></div>
            </div>
        </div>

        <div class="app-container">
            <header>
                <h1>Blackjack <span>Online</span></h1>
                <div class="score-board">
                    <div class="score-item">Wins: <span id="wins-count">0</span></div>
                    <div class="score-item">Losses: <span id="losses-count">0</span></div>
                    <div class="score-item">Pushes: <span id="pushes-count">0</span></div>
                </div>
            </header>

            <main class="game-board">
                <section class="dealer-area">
                    <h2>Dealer <span id="dealer-score" class="score-badge">?</span></h2>
                    <div id="dealer-cards" class="cards-container"></div>
                </section>

                <div class="game-message-container">
                    <h3 id="game-message">Place your bet and deal!</h3>
                </div>

                <section class="player-area">
                    <h2>Player <span id="player-score" class="score-badge">0</span></h2>
                    <div id="player-cards"></div>
                </section>
            </main>

            <nav class="controls">
                <button id="btn-deal" class="btn primary" disabled>Deal</button>
                <button id="btn-hit" class="btn secondary" disabled>Hit</button>
                <button id="btn-stand" class="btn secondary" disabled>Stand</button>
                <button id="btn-split" class="btn secondary" disabled>Split</button>
                <button id="btn-double" class="btn secondary" disabled>Double Down</button>
            </nav>
        </div>

    </div>

    <!-- Admin Button (always visible, tiny) -->
    <button id="btn-admin" class="admin-trigger">Admin</button>

    <!-- Admin Login -->
    <div id="admin-login" class="admin-overlay hidden">
        <div class="admin-login-box">
            <h3>🔒 Admin Access</h3>
            <input type="password" id="admin-password" placeholder="Enter password..." autocomplete="off">
            <div class="admin-login-btns">
                <button id="admin-login-submit">Enter</button>
                <button id="admin-login-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="admin-overlay hidden">
        <div class="admin-panel-box">
            <h3>⚡ Admin Panel</h3>
            <div class="admin-controls">
                <div class="admin-row">
                    <label>Set Balance: $</label>
                    <input type="number" id="admin-set-balance" value="10000" min="0">
                    <button id="admin-btn-set-balance">Set</button>
                </div>
                <div class="admin-row">
                    <label>Add Balance: $</label>
                    <input type="number" id="admin-add-balance" value="1000" min="0">
                    <button id="admin-btn-add-balance">Add</button>
                </div>
                <div class="admin-row">
                    <label>Reset Stats</label>
                    <button id="admin-btn-reset-stats">Reset W/L/P</button>
                </div>
                <div class="admin-row">
                    <label>Next Hand</label>
                    <button id="admin-btn-force-bj" class="admin-btn-inactive">Force Blackjack: OFF</button>
                </div>
                <div class="admin-row">
                    <label>Events</label>
                    <button id="admin-btn-events" class="admin-btn-inactive" style="background: linear-gradient(135deg, #f59e0b, #d97706) !important; color: white !important;">Event Dashboard</button>
                </div>
            </div>
            <button id="admin-close" class="admin-close-btn">Close</button>
        </div>
    </div>

    <!-- Event Dashboard -->
    <div id="event-dashboard" class="admin-overlay hidden">
        <div class="admin-panel-box" style="border-color: #f59e0b; box-shadow: 0 0 40px rgba(245, 158, 11, 0.15);">
            <h3 style="color: #f59e0b; text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);">🎉 Event Dashboard</h3>
            <div class="admin-controls">
                <div class="admin-row" style="flex-direction: column; gap: 10px;">
                    <label style="font-size: 1rem;">Disco Night Event</label>
                    <p style="font-size: 0.75rem; color: #94a3b8; margin: 0;">Adds groovy background & +25% Blackjack chance!</p>
                    <button id="event-btn-disco" class="admin-btn-inactive" style="padding: 1rem 2rem; font-size: 1.2rem;">Disco: OFF</button>
                </div>
            </div>
            <button id="event-dashboard-close" class="admin-close-btn">Back to Game</button>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
